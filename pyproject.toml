[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-ready"
version = "0.2.0"
description = "Local, single-round Windows ready-button assistant"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6>=6.8,<6.11", "opencv-python-headless>=4.10,<5", "numpy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.12,<1", "pyinstaller>=6.11,<7"]

[project.gui-scripts]
auto-ready = "auto_ready.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
junit_family = "xunit1"
markers = ["desktop: read-only Windows desktop checks", "real_input: explicitly opted-in simulator mouse input"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
